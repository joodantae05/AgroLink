<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' http://localhost:8000 https://localhost:8000; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    />
    <title>Agrolink | Alerts (béta)</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <header>
      <div class="navbar">
        <div class="logo">Agrolink</div>
        <nav>
          <a href="index.html">Login</a>
          <a href="dashboard.html">Dashboard</a>
          <a href="device.html">Device</a>
          <a href="alerts.html" class="active">Alerts (béta)</a>
          <a href="settings.html">Settings</a>
          <a href="privacy.html">RGPD</a>
        </nav>
      </div>
    </header>

    <main class="container">
      <section class="surface toolbar">
        <div class="stack">
          <label for="alert-sensor">Capteur</label>
          <select id="alert-sensor">
            <option value="">Tous les capteurs</option>
          </select>
        </div>
        <div class="stack">
          <label for="alert-period">Periode</label>
          <select id="alert-period">
            <option>24h</option>
            <option>7 jours</option>
            <option>30 jours</option>
          </select>
        </div>
        <button class="button secondary" type="button">Appliquer</button>
      </section>

      <section class="section-title">
        <h2>Historique des alertes (béta)</h2>
        <span class="status-pill">Suivi priorise (béta)</span>
      </section>

      <div id="alert-list" class="alert-list" data-mode="history"></div>

      <p class="footer-note">Filtrez par capteur et periode pour identifier rapidement les causes recurrentes. Le module alertes est en phase (béta).</p>
    </main>
  </body>
</html>
